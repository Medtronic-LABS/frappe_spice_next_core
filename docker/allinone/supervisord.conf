; Runs as root so it can drop privileges per-program (everything runs as `frappe`).
; Started by entrypoint.sh via `exec supervisord`. Postgres is external -- see
; docs/superpowers/specs/2026-09-18-postgres-reuse-design.md in the uhis app repo --
; so there's no database server program here, only Redis.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:redis]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
command=/usr/bin/redis-server /home/frappe/redis-uhis.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log

; One-shot: create site (if missing), install spice_next_core (if missing), always
; migrate, then touch the marker file that wait-for-site.sh polls for. Deliberately
; not autorestarted — a completed run should stay EXITED(0), not be relaunched.
[program:site-setup]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/site-setup.sh
autostart=true
autorestart=false
startretries=0
priority=20
stdout_logfile=/var/log/supervisor/site-setup.log
stderr_logfile=/var/log/supervisor/site-setup.err.log

[program:backend]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/wait-for-site.sh /usr/local/bin/run-backend.sh
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend.err.log

[program:websocket]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/wait-for-site.sh node apps/frappe/socketio.js
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/websocket.log
stderr_logfile=/var/log/supervisor/websocket.err.log

[program:worker]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/wait-for-site.sh bench worker --queue default,short,long
autostart=true
autorestart=true
priority=30
stopwaitsecs=60
stdout_logfile=/var/log/supervisor/worker.log
stderr_logfile=/var/log/supervisor/worker.err.log

[program:scheduler]
user=frappe
environment=HOME="/home/frappe",USER="frappe"
directory=/home/frappe/frappe-bench
command=/usr/local/bin/wait-for-site.sh bench schedule
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler.err.log
