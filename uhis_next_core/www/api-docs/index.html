<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UHIS-Next Core API Docs</title>
  <link rel="stylesheet" href="/assets/uhis_next_core/swagger-ui/swagger-ui.css">
  <link rel="icon" type="image/png" href="/assets/uhis_next_core/swagger-ui/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/assets/uhis_next_core/swagger-ui/favicon-16x16.png" sizes="16x16">
  <style>
    html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/assets/uhis_next_core/swagger-ui/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="/assets/uhis_next_core/swagger-ui/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/assets/uhis_next_core/openapi.yaml",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
