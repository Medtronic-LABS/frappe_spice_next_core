# Builds the all-in-one production image (docker/allinone/Dockerfile — bench +
# MariaDB + Redis in one container, see docker/allinone/ and
# frappe-uhis-next/docs/deployment/production.md for the full architecture),
# pushes it to GHCR, and — only on main — redeploys the production server over SSH.
#
# DISABLED (push/tag triggers commented out below): CI/CD control has moved to
# the uhis app repo (Medtronic-LABS/frappe_uhis, .github/workflows/docker-publish.yml)
# since uhis is the client-specific app that assembles everything a deployment
# actually ships (spice_next_core + shukhee_integration + leapwell_telemetry +
# uhis itself — see uhis/hooks.py required_apps), while this is the shared core
# package reused across deployments. Kept as workflow_dispatch-only so this image
# can still be built manually (e.g. to sanity-check spice_next_core in isolation)
# without also firing a production deploy.
name: Build, publish, and deploy

on:
  # push:
  #   branches: [main]
  #   tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase repository path — github.repository preserves the
  # GitHub org's actual casing (Medtronic-LABS/...), so this is spelled out
  # explicitly rather than derived, to avoid a push-time rejection.
  IMAGE_NAME: medtronic-labs/frappe_spice_next_core

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/allinone/Dockerfile
          build-args: |
            FRAPPE_BRANCH=version-16
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only redeploy from a direct push to main — a version-tag push builds and
    # publishes an immutable image but does not also trigger a redeploy of what a
    # preceding push to main already put live.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -eu
            cd /home/ubuntu/frappe_uhis_
            docker compose -f docker-compose.yml pull frappe-uhis
            docker compose -f docker-compose.yml up -d frappe-uhis
            echo "Waiting for application to start..."
            sleep 30

            # Hits uhis-next's OWN proxy directly on the deploy host (port 8081,
            # published by docker-compose.prod.yml) — NOT through the legacy
            # platform's shared gateway, so no /system-config prefix here.
            # Fail the workflow loudly if the new container isn't healthy.
            # No automated rollback (out of scope for this pass).
            for i in $(seq 1 20); do
              if curl -fsS -H "Host: lf.localhost" "http://localhost:8000/api/method/ping" >/dev/null; then
                echo "post-deploy healthcheck passed"
                exit 0
              fi
              sleep 5
            done
            echo "post-deploy healthcheck failed" >&2
            docker ps
            exit 1
